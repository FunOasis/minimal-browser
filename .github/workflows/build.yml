# =============================================================================
# Build APK — signed with the keystore from repository secrets.
# =============================================================================
# Requires these secrets (see generate-keystore.yml for how to create them):
#   KEYSTORE_BASE64
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
#
# If the secrets are missing, the build still succeeds but uses the default
# debug keystore — the resulting APK will NOT update in place across runs.
#
# versionCode is automatically derived from github.run_number, so each build
# has a strictly higher versionCode than the previous one. This lets Android
# accept every future APK as an update to the previously installed one.
# =============================================================================

name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK environment
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"        >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK"    >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools"           >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK 34 + build-tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Decode signing keystore (if secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PW:  ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_AL:       ${{ secrets.KEY_ALIAS }}
          KEY_PW:       ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret found. Building with debug signing only."
            echo "::warning::The APK will NOT update in place. Run generate-keystore.yml first."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PW" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_AL"             >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PW"          >> $GITHUB_ENV
          echo "Signing keystore decoded to $RUNNER_TEMP/release.keystore"

      - name: Run unit tests
        run: gradle testDebugUnitTest
        continue-on-error: true

      - name: Build signed debug APK
        run: gradle assembleDebug

      - name: Build signed release APK
        run: gradle assembleRelease
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalBrowser-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK (if built)
        uses: actions/upload-artifact@v4
        with:
          name: MinimalBrowser-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: ignore
