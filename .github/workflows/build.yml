name: Build APK

# ---------------------------------------------------------------------------
# Trigger policy
#   • push to main/master: runs, EXCEPT when only docs/metadata changed.
#   • push of a version tag (v1.2.3 or 1.2.3): runs the build AND the release
#     job, which attaches the APK to a GitHub Release. Tag pushes ignore
#     paths-ignore per GitHub docs, so tags always fire.
#   • pull_request:        runs, with the same doc-only exclusion.
#   • workflow_dispatch:   always runs (manual "Run workflow" always works,
#                          regardless of paths-ignore).
#
# When you edit build.yml itself, the push trigger still fires one run
# (the old file was active when you hit commit). That's expected.
# ---------------------------------------------------------------------------
on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'          # v0.0.1, v1.2.3
      - '[0-9]*'      # 0.0.1, 1.2.3
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Concurrency
#   Only one run per branch (per workflow) is allowed at a time. When a new
#   run starts on the same ref, any in-flight run for that ref is cancelled.
#   This is what stops the "7 queued runs from 7 quick commits" pile-up —
#   the six oldest get cancelled the moment the newest is scheduled.
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (manual)
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT"
          curl -fsSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-tmp
          mv cmdline-tools-tmp/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          rm -rf cmdline-tools.zip cmdline-tools-tmp
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses & install packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Decode keystore (if present)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "✅ Keystore decoded — release build will be SIGNED."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ KEYSTORE_BASE64 missing — fallback to debug signing."
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Build debug APK (no keystore)
        if: steps.keystore.outputs.present != 'true'
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for f in app/build/outputs/apk/release/*.apk; do
            cp "$f" "dist/MinimalBrowser-release-signed.apk"
          done
          for f in app/build/outputs/apk/debug/*.apk; do
            cp "$f" "dist/MinimalBrowser-debug.apk"
          done
          ls -la dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MinimalBrowser-apk
          path: dist/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release job
  #   Runs ONLY when the push that triggered this workflow was a tag push.
  #   Downloads the exact artifact the build job just produced (no rebuild),
  #   then creates or updates a GitHub Release with the same name as the tag
  #   and attaches every .apk inside it.
  #
  #   permissions: contents: write is required to create releases. It is set
  #   at the job level (not globally) so the build job keeps read-only scope.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MinimalBrowser-apk
          path: dist

      - name: Show downloaded APK(s)
        run: ls -la dist

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Minimal Browser ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
