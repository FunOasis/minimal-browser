# =============================================================================
# Generate Keystore (one-time workflow)
# =============================================================================
# Run this ONCE to create a signing key for your app. The key never changes,
# so every APK you build afterwards can be installed over the previous one
# without uninstalling.
#
# HOW TO USE:
#   1. Go to Actions → "Generate Keystore (one-time)" → Run workflow.
#   2. Fill in the three inputs (memorize the passwords!).
#   3. When the run finishes, scroll to the bottom, download the
#      "release-keystore" artifact, and open `keystore.base64` in any
#      text editor (or view it on your phone).
#   4. Copy the ENTIRE contents of keystore.base64 (it's one long line).
#   5. Repo → Settings → Secrets and variables → Actions → New repository secret.
#      Add these four secrets:
#         KEYSTORE_BASE64    = <paste the base64 here>
#         KEYSTORE_PASSWORD  = <the keystore password you entered>
#         KEY_ALIAS          = <the key alias you entered>
#         KEY_PASSWORD       = <the key password you entered>
#   6. (Optional but recommended for public repos) Delete the artifact after
#      copying the base64, so it doesn't linger.
#   7. Run the "Build APK" workflow — subsequent APKs will be signed with
#      this key and will update in place.
#
# ⚠️  BACK UP the keystore file + passwords somewhere safe (cloud drive, etc.).
#     If you lose them, you cannot update your app without changing the
#     package name or having users uninstall.
# =============================================================================

name: Generate Keystore (one-time)

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Keystore password (min 6 chars) — MEMORIZE THIS'
        required: true
        default: 'minimalbrowser'
      key_alias:
        description: 'Key alias'
        required: true
        default: 'minimalbrowser'
      key_password:
        description: 'Key password (may equal keystore password)'
        required: true
        default: 'minimalbrowser'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        env:
          KS_PASS: ${{ inputs.keystore_password }}
          KEY_PASS: ${{ inputs.key_password }}
          ALIAS: ${{ inputs.key_alias }}
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=MinimalBrowser, OU=Dev, O=MinimalBrowser, L=Unknown, ST=Unknown, C=US"

      - name: Base64-encode keystore
        run: base64 -w 0 release.keystore > keystore.base64

      - name: Print setup instructions
        run: |
          echo "================================================================"
          echo "  NEXT STEPS:"
          echo "  1. Download the 'release-keystore' artifact from this run."
          echo "  2. Open keystore.base64 in any text editor."
          echo "  3. Copy the entire (single-line) contents."
          echo "  4. Add these repository secrets at:"
          echo "     Repo → Settings → Secrets and variables → Actions"
          echo ""
          echo "     KEYSTORE_BASE64    = <contents of keystore.base64>"
          echo "     KEYSTORE_PASSWORD  = <the keystore password you entered>"
          echo "     KEY_ALIAS          = <the key alias you entered>"
          echo "     KEY_PASSWORD       = <the key password you entered>"
          echo ""
          echo "  5. Delete this artifact once the secret is saved (recommended)."
          echo "  6. Run the 'Build APK' workflow."
          echo "================================================================"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            keystore.base64
          retention-days: 7
