name: Generate Release Keystore (one-time)

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'minimalbrowser'
      validity_days:
        description: 'Validity in days'
        required: true
        default: '10000'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          set -euo pipefail
          ALIAS="${{ inputs.alias }}"
          VALIDITY="${{ inputs.validity_days }}"

          STORE_PASS="$(openssl rand -base64 24 | tr -d '=+/' | cut -c1-24)"
          KEY_PASS="$STORE_PASS"
          KEYSTORE="release.keystore"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 \
            -validity "$VALIDITY" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=MinimalBrowser, OU=Mobile, O=MinimalBrowser, L=Unknown, ST=Unknown, C=US"

          B64="$(base64 -w0 "$KEYSTORE")"

          {
            echo "## 🔐 Keystore generated"
            echo ""
            echo "### Step 1 — Add these 4 repository secrets"
            echo "GitHub → repo → **Settings → Secrets and variables → Actions → New repository secret**"
            echo ""
            echo "| Secret name | Value |"
            echo "|---|---|"
            echo "| \`KEYSTORE_BASE64\` | (copy the block in Step 2) |"
            echo "| \`KEYSTORE_PASSWORD\` | \`$STORE_PASS\` |"
            echo "| \`KEY_ALIAS\` | \`$ALIAS\` |"
            echo "| \`KEY_PASSWORD\` | \`$KEY_PASS\` |"
            echo ""
            echo "### Step 2 — Copy KEYSTORE_BASE64 (whole block, no spaces)"
            echo ""
            echo '```'
            echo "$B64"
            echo '```'
            echo ""
            echo "⚠️ These are shown only once. Save them somewhere safe."
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p out
          cp "$KEYSTORE" out/release.keystore
          echo "$B64" > out/KEYSTORE_BASE64.txt
          cat > out/CREDENTIALS.txt <<EOF
          KEYSTORE_PASSWORD=$STORE_PASS
          KEY_ALIAS=$ALIAS
          KEY_PASSWORD=$KEY_PASS
          EOF

      - name: Upload keystore artifact (backup, 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: out/
          retention-days: 7
