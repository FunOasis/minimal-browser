// =============================================================================
// Signing behaviour:
//   • If KEYSTORE_PATH + KEYSTORE_PASSWORD + KEY_ALIAS + KEY_PASSWORD are set
//     (they are, in CI, when you've configured the four repository secrets),
//     both debug and release APKs are signed with your permanent keystore.
//   • If those env vars are missing (local builds without a keystore),
//     Gradle falls back to the default debug key — fine for casual testing,
//     but updates won't install in place.
//   • versionCode comes from GITHUB_RUN_NUMBER so every CI run produces a
//     higher versionCode, allowing in-place updates.
// =============================================================================

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// -----------------------------------------------------------------------------
// IMPORTANT — why these values are computed here and not inline:
//
// Groovy parses `versionCode (expr).toInteger()` ambiguously. It treats the
// call as `versionCode(expr)` (which returns void in the Android DSL) followed
// by `.toInteger()` on that void — hence "Value is null". Pre-computing the
// values into local variables removes the ambiguity entirely.
// -----------------------------------------------------------------------------
def ciRunNumber        = System.getenv("GITHUB_RUN_NUMBER")
def isNumericRunNumber = ciRunNumber != null && ciRunNumber.isInteger()
def computedVersionCode = isNumericRunNumber ? ciRunNumber.toInteger() : 1
def computedVersionName = "1.0.${computedVersionCode}"

def keystorePath        = System.getenv("KEYSTORE_PATH")
def hasReleaseKeystore  = keystorePath != null

android {
    namespace 'com.minimalbrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.minimalbrowser"
        minSdk 26
        targetSdk 34

        versionCode computedVersionCode
        versionName computedVersionName

        ndk { abiFilters "arm64-v8a", "x86_64" }
    }

    // --- Signing configs --------------------------------------------------
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile     file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias      System.getenv("KEY_ALIAS")
                keyPassword   System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        viewBinding true
        dataBinding false
    }

    // Makes android.util.Log and friends return default values instead of
    // throwing "Stub!" when called from pure-JVM unit tests.
    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
}
