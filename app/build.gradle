// =============================================================================
// Signing behaviour:
//   • If KEYSTORE_PATH (or KEYSTORE_FILE) + KEYSTORE_PASSWORD + KEY_ALIAS +
//     KEY_PASSWORD are all set AND the keystore file exists, both debug and
//     release APKs are signed with the permanent keystore → in-place updates
//     work on real devices.
//   • Otherwise the release build type is left unsigned (debug still falls
//     back to the default debug key), which is fine for CI smoke tests.
//   • versionCode comes from GITHUB_RUN_NUMBER so every CI run bumps it,
//     allowing in-place updates.
// =============================================================================
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// -----------------------------------------------------------------------------
// Groovy parses `versionCode (expr).toInteger()` ambiguously — pre-compute.
// -----------------------------------------------------------------------------
def ciRunNumber = System.getenv("GITHUB_RUN_NUMBER")
def isNumericRunNumber = ciRunNumber != null && ciRunNumber.isInteger()
def computedVersionCode = isNumericRunNumber ? ciRunNumber.toInteger() : 1
def computedVersionName = "1.0.${computedVersionCode}"

// -----------------------------------------------------------------------------
// Keystore env — accept BOTH names so this file works with either workflow
// variant (KEYSTORE_PATH is what we read first; KEYSTORE_FILE is a fallback).
// -----------------------------------------------------------------------------
def envKeystorePath  = System.getenv("KEYSTORE_PATH") ?: System.getenv("KEYSTORE_FILE")
def envStorePassword = System.getenv("KEYSTORE_PASSWORD")
def envKeyAlias      = System.getenv("KEY_ALIAS")
def envKeyPassword   = System.getenv("KEY_PASSWORD")

def keystoreFile = envKeystorePath ? file(envKeystorePath) : null
def hasReleaseKeystore = keystoreFile != null && keystoreFile.exists() &&
        envStorePassword != null && !envStorePassword.isEmpty() &&
        envKeyAlias != null && !envKeyAlias.isEmpty() &&
        envKeyPassword != null && !envKeyPassword.isEmpty()

logger.lifecycle(hasReleaseKeystore
        ? "🔐 Signing with release keystore: ${keystoreFile}"
        : "⚠️ No release keystore found — release APK will be UNSIGNED.")

android {
    namespace 'com.minimalbrowser'
    compileSdk 34

    defaultConfig {
        applicationId "com.minimalbrowser"
        minSdk 26
        targetSdk 34
        versionCode computedVersionCode
        versionName computedVersionName

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    // --- Signing configs --------------------------------------------------
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile keystoreFile
                storePassword envStorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
        debug {
            if (hasReleaseKeystore) {
                // Deliberately sign debug with the release key when available,
                // so debug ↔ release installs replace each other cleanly.
                signingConfig signingConfigs.release
            }
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        dataBinding false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    testImplementation 'junit:junit:4.13.2'
}
