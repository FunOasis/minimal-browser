<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minimal Browser</title>
<style>
  :root {
    --accent:      #4D6BFE;
    --accent-dim:  rgba(77, 107, 254, 0.55);
    --text:        #FFFFFF;
    --text-2:      #8A8A8A;
    --text-3:      #5C5C5C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #000;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px 24px;
  }

  /* ---- Brand monogram -------------------------------------------- */
  .brand {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.42em;
    color: var(--text-2);
    margin-bottom: 44px;
    padding-left: 0.42em;
    user-select: none;
  }
  .brand .dot { color: var(--accent); }

  /* ---- Search pill ----------------------------------------------- */
  .search-wrap {
    width: 100%;
    max-width: 480px;
    position: relative;
  }
  .search-input {
    width: 100%;
    height: 52px;
    background: #1A1A1A;
    border: 1px solid #262626;
    border-radius: 26px;
    color: var(--text);
    font-size: 15px;
    padding: 0 54px 0 20px;
    outline: none;
    -webkit-appearance: none;
  }
  .search-input::placeholder { color: var(--text-3); }
  .search-input:focus { border-color: var(--accent-dim); }
  .search-btn {
    position: absolute;
    right: 6px; top: 6px;
    width: 40px; height: 40px;
    border-radius: 20px;
    border: none;
    background: transparent;
    color: var(--text-2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .search-btn svg { width: 20px; height: 20px; }

  /* ---- Footer ---------------------------------------------------- */
  footer {
    margin-top: auto;
    padding-top: 56px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.32em;
    color: #2E2E2E;
    user-select: none;
  }
</style>
</head>
<body>

  <div class="brand">M<span class="dot">·</span>B</div>

  <div class="search-wrap">
    <form id="sform" action="https://search.brave.com/search" method="get" autocomplete="off">
      <input
        id="q"
        class="search-input"
        type="text"
        name="q"
        placeholder="Search or type a URL"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false">
      <button class="search-btn" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="20" y1="20" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </form>
  </div>

  <footer>MINIMAL BROWSER</footer>

  <script>
    document.getElementById('sform').addEventListener('submit', function (e) {
      var v = document.getElementById('q').value.trim();
      if (!v) { e.preventDefault(); return; }
      if (/^https?:\/\//i.test(v)) { e.preventDefault(); location.href = v; return; }
      if (v.indexOf('.') !== -1 && v.indexOf(' ') === -1) {
        e.preventDefault();
        location.href = 'https://' + v;
      }
    });
  </script>

</body>
</html>
