// SDK / toolchain note:
//   compileSdk/targetSdk 36 (see app/build.gradle) only requires an AGP
//   release that supports API level 36. AGP 8.13 already does -- Google's
//   own compatibility table lists AGP 8.13 as supporting up to API level
//   36.1, requiring Gradle 8.13 (min and default) and JDK 17. That means
//   there is no need to jump to AGP 9.x for this.
//
//   AGP 9.x is deliberately NOT used here: starting at 9.0, AGP ships
//   "built-in Kotlin" support and registers the `kotlin` Gradle extension
//   itself. Applying `org.jetbrains.kotlin.android` (as app/build.gradle
//   does, and as its classic `android.kotlinOptions{}` block requires)
//   on top of that then fails with:
//     Cannot add extension with name 'kotlin', as there is an extension
//     already registered with that name.
//   Avoiding that migration (removing the Kotlin plugin, moving
//   kotlinOptions{} to a top-level kotlin.compilerOptions{} block) is a
//   second, separate migration that this project does not need to take
//   on just to reach compileSdk 36 -- AGP 8.13.2 reaches the same SDK
//   target while keeping the project's existing, classic Kotlin plugin
//   setup completely unchanged.
plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.3.10' apply false
}
